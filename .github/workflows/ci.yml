name: CI

# Changes that can't affect the build are skipped. Package READMEs (src/**/README.md) and assets/ are not
# listed: they go into the packages, so the pack job must still run for them.
on:
  push:
    branches: [master]
    paths-ignore:
      - 'README.md'
      - 'LICENSE'
      - 'docs/**'
      - 'CLAUDE.md'
      - '.claude/**'
  pull_request:
    paths-ignore:
      - 'README.md'
      - 'LICENSE'
      - 'docs/**'
      - 'CLAUDE.md'
      - '.claude/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Superseded pull request runs are cancelled; every push to master keeps its own result.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v7

      # The SDK comes from global.json. Tests also run on net8.0, which needs the .NET 8 runtime;
      # net9.0 is only built, so it needs no runtime.
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore Dut00.AppInfo.slnx

      - name: Build
        run: dotnet build Dut00.AppInfo.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test --solution Dut00.AppInfo.slnx --configuration Release --no-build

  pack:
    name: Pack
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Pack
        shell: pwsh
        run: ./build/pack.ps1

      - name: Build the sample against the packed packages
        run: dotnet build samples/Dut00.AppInfo.Sample.Api --configuration Release -p:UseLocalPackages=true

      - uses: actions/upload-artifact@v7
        with:
          name: packages
          path: artifacts/
          if-no-files-found: error
