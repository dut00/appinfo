name: Release

# Publishes the packages to nuget.org, started in one of two ways:
#   - push a version tag:  git tag v1.0.1 && git push origin v1.0.1
#   - run it from GitHub (Actions > Release > Run workflow) on the default branch with a version such as 1.0.1;
#     the run creates the v<version> tag on the commit it built, before pushing to nuget.org.
# A version with a suffix (-preview.1, -rc.1, ...) becomes a NuGet prerelease and a GitHub prerelease.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish, without the v prefix (for example 1.0.3 or 1.1.0-preview.1)'
        required: true
        type: string

permissions:
  contents: write # create the GitHub release
  id-token: write # nuget.org Trusted Publishing (OIDC), no API key secret needed

concurrency:
  group: release
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  release:
    name: Publish to nuget.org
    runs-on: ubuntu-latest
    # Protect this environment with a required reviewer (Settings > Environments) to approve every release.
    environment: nuget

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          dotnet-version: 8.0.x

      - name: Read the version
        id: version
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            # A manual release always comes from the default branch, so it never publishes unmerged code.
            if [[ "$GITHUB_REF" != "refs/heads/$DEFAULT_BRANCH" ]]; then
              echo "::error::Run the release from '$DEFAULT_BRANCH', not '$GITHUB_REF_NAME'."
              exit 1
            fi
            version="${INPUT_VERSION#v}" # tolerate a typed v prefix
            source="Version '$INPUT_VERSION'"
          else
            version="${GITHUB_REF_NAME#v}"
            source="Tag '$GITHUB_REF_NAME'"
          fi
          # SemVer without build metadata: no leading zeros, no empty prerelease identifiers.
          if [[ ! "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]; then
            echo "::error::$source is not [v]<major>.<minor>.<patch>[-suffix]."
            exit 1
          fi
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            # Fail early instead of after the tests. "Create the tag" below is the real guard.
            # --exit-code: 0 = the tag exists, 2 = it doesn't, anything else = the check itself failed.
            # A tag on this very commit is left by an earlier failed run of this release: carry on, so
            # re-running finishes it (packages already on nuget.org are skipped).
            rc=0
            existing="$(git ls-remote --exit-code --tags origin "refs/tags/v$version")" || rc=$?
            if [[ $rc -eq 0 ]]; then
              if [[ "${existing%%[[:space:]]*}" == "$GITHUB_SHA" ]]; then
                echo "::notice::Tag v$version already points at $GITHUB_SHA, resuming that release."
                echo "tag_exists=true" >> "$GITHUB_OUTPUT"
              else
                echo "::error::Tag v$version already exists on another commit. Pick a new version."
                exit 1
              fi
            elif [[ $rc -ne 2 ]]; then
              echo "::error::Could not check whether tag v$version exists (git exit code $rc)."
              exit 1
            fi
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          if [[ "$version" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Test
        run: dotnet test --solution Dut00.AppInfo.slnx --configuration Release

      - name: Pack
        shell: pwsh
        run: ./build/pack.ps1 -Version '${{ steps.version.outputs.version }}'

      # Manual runs create the tag on the tested commit before anything reaches nuget.org: the push can't be
      # undone, so a missing permission, a tag ruleset or a tag created meanwhile must stop the run here.
      # Creating a ref that already exists fails, so this also settles two runs racing for the same version.
      # A tag created with GITHUB_TOKEN does not start this workflow again.
      - name: Create the tag
        if: github.event_name == 'workflow_dispatch' && steps.version.outputs.tag_exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: gh api "repos/$GITHUB_REPOSITORY/git/refs" -f "ref=refs/tags/$TAG" -f "sha=$GITHUB_SHA" > /dev/null

      - name: Log in to nuget.org
        id: nuget-login
        uses: NuGet/login@v1
        with:
          # The nuget.org account name (not the e-mail), stored as a repository variable.
          user: ${{ vars.NUGET_USER }}

      # Not --skip-duplicate: it reports every 409 as "already exists", but nuget.org also answers 409 for
      # other reasons (for example a reserved package ID), which would hide the real error and still pass.
      # Only versions nuget.org already serves are skipped; any other failure fails the job with the
      # server's message. Symbol packages (.snupkg) next to the .nupkg files are pushed automatically.
      - name: Push to nuget.org
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: |
          pushed=0
          for package in artifacts/*.nupkg; do
            nuspec="$(unzip -p "$package" '*.nuspec')"
            id="$(sed -n 's:.*<id>\(.*\)</id>.*:\1:p' <<< "$nuspec" | head -n 1)"
            version="$(sed -n 's:.*<version>\(.*\)</version>.*:\1:p' <<< "$nuspec" | head -n 1)"
            index="https://api.nuget.org/v3-flatcontainer/${id,,}/index.json"
            if curl -fsSL "$index" 2>/dev/null | grep -q "\"${version,,}\""; then
              echo "::notice::$id $version is already on nuget.org, skipping."
              continue
            fi
            echo "Pushing $id $version"
            dotnet nuget push "$package" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json
            pushed=$((pushed + 1))
          done
          echo "Pushed $pushed package(s)."

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          # The tag exists in both cases: pushed by hand, or created by "Create the tag".
          flags=(--title "$TAG" --generate-notes --verify-tag)
          if [[ "$PRERELEASE" == "true" ]]; then flags+=(--prerelease); fi
          gh release create "$TAG" artifacts/*.nupkg artifacts/*.snupkg "${flags[@]}"
