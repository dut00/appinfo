name: Release

# Publishes the packages to nuget.org when a version tag is pushed:
#   git tag v0.1.0-preview.1 && git push origin v0.1.0-preview.1
# A tag with a suffix (-preview.1, -rc.1, ...) becomes a NuGet prerelease and a GitHub prerelease.
on:
  push:
    tags: ['v*']

permissions:
  contents: write # create the GitHub release
  id-token: write # nuget.org Trusted Publishing (OIDC), no API key secret needed

concurrency:
  group: release
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  release:
    name: Publish to nuget.org
    runs-on: ubuntu-latest
    # Protect this environment with a required reviewer (Settings > Environments) to approve every release.
    environment: nuget

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          dotnet-version: 8.0.x

      - name: Read the version from the tag
        id: version
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          # SemVer without build metadata: no leading zeros, no empty prerelease identifiers.
          if [[ ! "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]; then
            echo "::error::Tag '$GITHUB_REF_NAME' is not v<major>.<minor>.<patch>[-suffix]."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$version" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Test
        run: dotnet test --solution Dut00.AppInfo.slnx --configuration Release

      - name: Pack
        shell: pwsh
        run: ./build/pack.ps1 -Version '${{ steps.version.outputs.version }}'

      - name: Log in to nuget.org
        id: nuget-login
        uses: NuGet/login@v1
        with:
          # The nuget.org account name (not the e-mail), stored as a repository variable.
          user: ${{ vars.NUGET_USER }}

      # Not --skip-duplicate: it reports every 409 as "already exists", but nuget.org also answers 409 for
      # other reasons (for example a reserved package ID), which would hide the real error and still pass.
      # Only versions nuget.org already serves are skipped; any other failure fails the job with the
      # server's message. Symbol packages (.snupkg) next to the .nupkg files are pushed automatically.
      - name: Push to nuget.org
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: |
          pushed=0
          for package in artifacts/*.nupkg; do
            nuspec="$(unzip -p "$package" '*.nuspec')"
            id="$(sed -n 's:.*<id>\(.*\)</id>.*:\1:p' <<< "$nuspec" | head -n 1)"
            version="$(sed -n 's:.*<version>\(.*\)</version>.*:\1:p' <<< "$nuspec" | head -n 1)"
            index="https://api.nuget.org/v3-flatcontainer/${id,,}/index.json"
            if curl -fsSL "$index" 2>/dev/null | grep -q "\"${version,,}\""; then
              echo "::notice::$id $version is already on nuget.org, skipping."
              continue
            fi
            echo "Pushing $id $version"
            dotnet nuget push "$package" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json
            pushed=$((pushed + 1))
          done
          echo "Pushed $pushed package(s)."

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
        run: |
          flags=(--title "$GITHUB_REF_NAME" --generate-notes --verify-tag)
          if [[ "$PRERELEASE" == "true" ]]; then flags+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" artifacts/*.nupkg artifacts/*.snupkg "${flags[@]}"
